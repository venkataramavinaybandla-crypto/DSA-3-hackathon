<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Cerberus architecture: presentation layer, core engine, persistence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#FF2D95"/>
    </marker>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#F8F8FF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="16" fill="#0A0812"/>
  <rect width="1200" height="500" rx="16" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="15.5" fill="none" stroke="#2A2145"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

    <rect x="50" y="130" width="250" height="240" rx="12" fill="#14102A" stroke="#2A2145"/>
    <text x="74" y="166" font-size="16" font-weight="600" fill="#F8F8FF">Presentation</text>
    <rect x="74" y="188" width="202" height="62" rx="8" fill="#1B1638" stroke="#3A2D6B"/>
    <text x="90" y="214" font-size="14" font-weight="600" fill="#F8F8FF">Console interface</text>
    <text x="90" y="234" font-size="12" fill="#9A93B8">Menus and reports</text>
    <rect x="74" y="266" width="202" height="62" rx="8" fill="none" stroke="#3A2D6B" stroke-dasharray="5 4"/>
    <text x="90" y="292" font-size="14" font-weight="600" fill="#F8F8FF">JavaFX report views</text>
    <text x="90" y="312" font-size="12" fill="#9A93B8">Optional</text>

    <rect x="375" y="70" width="450" height="360" rx="12" fill="#14102A" stroke="#7B2FF7" stroke-width="1.5"/>
    <text x="399" y="106" font-size="16" font-weight="600" fill="#F8F8FF">Core engine</text>

    <rect x="399" y="128" width="195" height="134" rx="8" fill="#1B1638" stroke="#3A2D6B"/>
    <rect x="399" y="128" width="4" height="134" rx="2" fill="#7B2FF7"/>
    <text x="419" y="160" font-size="15" font-weight="600" fill="#F8F8FF">Citation graph</text>
    <text x="419" y="184" font-size="12.5" fill="#9A93B8">Adjacency list</text>
    <text x="419" y="204" font-size="12.5" fill="#9A93B8">Reachability and lineage</text>
    <text x="419" y="224" font-size="12.5" fill="#9A93B8">traversal</text>

    <rect x="606" y="128" width="195" height="134" rx="8" fill="#1B1638" stroke="#3A2D6B"/>
    <rect x="606" y="128" width="4" height="134" rx="2" fill="#B24BF3"/>
    <text x="626" y="160" font-size="15" font-weight="600" fill="#F8F8FF">Hash tables</text>
    <text x="626" y="184" font-size="12.5" fill="#9A93B8">Open addressing</text>
    <text x="626" y="204" font-size="12.5" fill="#9A93B8">Title and author lookup</text>
    <text x="626" y="224" font-size="12.5" fill="#9A93B8">in O(1) average</text>

    <rect x="399" y="276" width="195" height="134" rx="8" fill="#1B1638" stroke="#3A2D6B"/>
    <rect x="399" y="276" width="4" height="134" rx="2" fill="#FF2D95"/>
    <text x="419" y="308" font-size="15" font-weight="600" fill="#F8F8FF">String matching</text>
    <text x="419" y="332" font-size="12.5" fill="#9A93B8">KMP</text>
    <text x="419" y="352" font-size="12.5" fill="#9A93B8">Rabin-Karp</text>
    <text x="419" y="372" font-size="12.5" fill="#9A93B8">Wagner-Fischer</text>

    <rect x="606" y="276" width="195" height="134" rx="8" fill="#1B1638" stroke="#3A2D6B"/>
    <rect x="606" y="276" width="4" height="134" rx="2" fill="#F8F8FF"/>
    <text x="626" y="308" font-size="15" font-weight="600" fill="#F8F8FF">Sort routines</text>
    <text x="626" y="332" font-size="12.5" fill="#9A93B8">Citation-count ranking</text>
    <text x="626" y="352" font-size="12.5" fill="#9A93B8">Hand-built, O(n log n)</text>

    <rect x="900" y="130" width="250" height="240" rx="12" fill="#14102A" stroke="#2A2145"/>
    <text x="924" y="166" font-size="16" font-weight="600" fill="#F8F8FF">Persistence</text>
    <rect x="924" y="188" width="202" height="62" rx="8" fill="#1B1638" stroke="#3A2D6B"/>
    <text x="940" y="214" font-size="14" font-weight="600" fill="#F8F8FF">papers.csv</text>
    <text x="940" y="234" font-size="12" fill="#9A93B8">Paper records</text>
    <rect x="924" y="266" width="202" height="62" rx="8" fill="#1B1638" stroke="#3A2D6B"/>
    <text x="940" y="292" font-size="14" font-weight="600" fill="#F8F8FF">citation_data.csv</text>
    <text x="940" y="312" font-size="12" fill="#9A93B8">Citation edges</text>

    <line x1="302" y1="250" x2="373" y2="250" stroke="#FF2D95" stroke-width="2" marker-end="url(#head)"/>
    <text x="337" y="236" font-size="12" text-anchor="middle" fill="#9A93B8">queries</text>
    <line x1="827" y1="250" x2="898" y2="250" stroke="#FF2D95" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/>
    <text x="862" y="236" font-size="12" text-anchor="middle" fill="#9A93B8">load, save</text>
  </g>
</svg>
