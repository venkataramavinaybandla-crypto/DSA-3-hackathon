<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Cerberus Citation Analysis System" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.55" stop-color="#B24BF3"/>
      <stop offset="1" stop-color="#FF2D95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#F8F8FF" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L10,5 L0,9 z" fill="#B24BF3"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="16" fill="#0A0812"/>
  <rect width="1200" height="340" rx="16" fill="url(#dots)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" fill="none" stroke="#2A2145"/>

  <g stroke="#B24BF3" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="182.7" y1="125.1" x2="134.3" y2="211.2"/>
    <line x1="197.3" y1="125.1" x2="245.7" y2="211.2"/>
    <line x1="141" y1="226" x2="237" y2="226"/>
  </g>
  <circle cx="190" cy="112" r="13" fill="#FF2D95"/>
  <circle cx="126" cy="226" r="13" fill="#0A0812" stroke="#F8F8FF" stroke-width="2"/>
  <circle cx="254" cy="226" r="13" fill="#0A0812" stroke="#F8F8FF" stroke-width="2"/>

  <line x1="330" y1="92" x2="330" y2="248" stroke="#2A2145" stroke-width="1.5"/>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="372" y="176" font-size="66" font-weight="300" letter-spacing="18" fill="#F8F8FF">CERBERUS</text>
    <text x="375" y="216" font-size="17" font-weight="600" letter-spacing="7" fill="url(#brand)">CITATION ANALYSIS SYSTEM</text>
    <text x="375" y="252" font-size="15" letter-spacing="0.6" fill="#9A93B8">A directed-graph engine for scholarly citations, hand-built in Java.</text>
  </g>

  <g opacity="0.55">
    <g stroke="#7B2FF7" stroke-width="1.2">
      <line x1="960" y1="70" x2="1040" y2="120"/>
      <line x1="1040" y1="120" x2="1120" y2="80"/>
      <line x1="1040" y1="120" x2="1010" y2="200"/>
      <line x1="1010" y1="200" x2="1110" y2="230"/>
      <line x1="1010" y1="200" x2="930" y2="250"/>
    </g>
    <circle cx="960" cy="70" r="4" fill="#B24BF3"/>
    <circle cx="1040" cy="120" r="6" fill="#FF2D95"/>
    <circle cx="1120" cy="80" r="4" fill="#B24BF3"/>
    <circle cx="1010" cy="200" r="5" fill="#B24BF3"/>
    <circle cx="1110" cy="230" r="4" fill="#F8F8FF"/>
    <circle cx="930" cy="250" r="3.5" fill="#F8F8FF"/>
  </g>

  <rect x="40" y="304" width="1120" height="2" rx="1" fill="url(#brand)"/>
</svg>
